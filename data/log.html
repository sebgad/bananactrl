<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <title>BananaCoffee</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3a2a1d">

  <script type="text/javascript">
    function getOldLog() {
      var xhr=new XMLHttpRequest();
      xhr.open("GET","lastlogfile.txt");

      xhr.onload= function() {
        document.getElementById("lastlog").textContent = xhr.responseText;
        }
      xhr.send();
    }

    function getRecentLog() {
      var xhr=new XMLHttpRequest();
      xhr.open("GET","recentlogfile.txt");

      xhr.onload= function() {
        document.getElementById("recentlog").textContent = xhr.responseText;
        }
      xhr.send();
    }
    setInterval(getRecentLog, 5000);
 </script> 
</head>
<body onload="getOldLog(); getRecentLog()">
<header class="topbar">
  <a class="brand" href="/"><img src="favicon-32x32.png" alt="">BananaCoffee</a>
  <nav class="navbar">
    <a href="/">Home</a>
    <a href="graphs.html">Graphs</a>
    <a href="settings.html">Settings</a>
    <a href="ota.html">Update</a>
    <a href="log.html" class="active">Log</a>
  </nav>
</header>

<main class="main">
  <div class="page-head">
    <h2>Debug Log</h2>
    <span class="subtle">Refreshes every 5 s</span>
  </div>
  <div class="card">
    <h3>Recent log</h3>
    <pre class="log" id="recentlog"></pre>
  </div>
  <div class="card">
    <h3>Log from previous session</h3>
    <pre class="log" id="lastlog"></pre>
  </div>
</main>

<footer class="footer">
  <span id="version">BananaCoffee</span>
  <script src="footer.js"></script>
</footer>

</body>
</html>
