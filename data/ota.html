<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <title>BananaCoffee</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <style>
    p {
      display: flex;
      justify-content: left;
      align-items: center;
    }

    p > span {
      display: inline-block;
      width: 20px;
    }

    p > span:first-child {
      display: inline-block;
      width: 200px;
    }
    </style>

<div class="header">
  <h1>BananaCoffee</h1>
  A simple <b>web interface</b> to control Rancilio Silvia espresso machine.
</div>

<div class="navbar">
  <a href="/">Home</a>
  <a href="graphs.html">Graphs</a>
  <a href="settings.html">Settings</a>
  <a href="ota.html" class="active">OTA</a>
  <a href="log.html">Debug Log</a>
  <a href="#" class="right">About</a>
</div>

<div class="main">
  <h2>Firmware Update</h2>
  <form id="firmwareForm">
    <label>MD5 Checksum for firmware</label>
    <input type="text" name="MD5" id="MD5">
    <input type="file" id="firmwareFile" accept=".bin">
    <input type="submit" name="upload" value="Upload" title="Upload Firmware">
  </form>
  <h2>Data file Update</h2>
  <form id="dataForm">
    <input type="file" id="dataFile">
    <input type="submit" name="upload" value="Upload" title="Upload File">
  </form>
  <p id="uploadStatus"></p>
  <script>
    // The file is sent as the raw request body (the ESP-IDF web server has no multipart parser).
    function upload(url, file, headers) {
      var status = document.getElementById("uploadStatus");
      if (!file) {
        alert("No file selected");
        return;
      }
      status.textContent = "Uploading " + file.name + " ...";
      fetch(url, {method: "POST", headers: headers, body: file})
        .then(function(response) { return response.text(); })
        .then(function(text) { status.textContent = text; alert(text); })
        .catch(function(error) { status.textContent = "Upload failed: " + error; });
    }

    document.getElementById("firmwareForm").onsubmit = function(event) {
      event.preventDefault();
      upload("/ota_firmware", document.getElementById("firmwareFile").files[0],
             {"X-MD5": document.getElementById("MD5").value.trim()});
    };

    document.getElementById("dataForm").onsubmit = function(event) {
      event.preventDefault();
      var file = document.getElementById("dataFile").files[0];
      upload("/ota_spiffs", file, file ? {"X-Filename": file.name} : {});
    };
  </script>
</div>

<div class="footer">
  <h5 id="version">BananaCoffee</h5>
  <script src="footer.js"></script>
</div>

</body>
</html>
