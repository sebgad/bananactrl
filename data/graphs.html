<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <title>BananaCoffee</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- uPlot, bundled in LittleFS (third_party/uplot): works without internet -->
  <link rel="stylesheet" href="uPlot.min.css">
  <script type="text/javascript" src="uPlot.min.js"></script>

  <!-- Java script for graphs.html -->
  <script type="text/javascript">
    // Columns: time [s], temperature [C], heater [%], target temperature [C]
    const series = [[], [], [], []];
    let plot = null;
    let lastTime = -1;

    function addRow(time, temp, pwm, target) {
      if (!(time > lastTime)) return; // rows already known (data.csv and live events overlap)
      lastTime = time;
      series[0].push(time);
      series[1].push(temp);
      series[2].push(pwm);
      series[3].push(target);
    }

    // data.csv: header lines up to "Time,...", then time,temperature,pwm,target,brewing
    function parseCsv(text) {
      const lines = text.split(/\r?\n/);
      let row = lines.findIndex(line => line.startsWith("Time,")) + 1;
      for (; row < lines.length; row++) {
        const cells = lines[row].split(",");
        if (cells.length < 4) continue;
        addRow(parseFloat(cells[0]), parseFloat(cells[1]), parseFloat(cells[2]), parseFloat(cells[3]));
      }
    }

    function chartSize() {
      const div = document.getElementById("chart_div");
      return {width: div.clientWidth, height: 600};
    }

    function createPlot() {
      const options = {
        title: "Temperature and Target PWM",
        ...chartSize(),
        scales: {x: {time: false}, temp: {range: [0, 100]}, pwm: {range: [0, 100]}},
        axes: [
          {label: "Time (s)"},
          {scale: "temp", label: "Temperature (\u00b0C)"},
          {scale: "pwm", label: "Target PWM (%)", side: 1, grid: {show: false}},
        ],
        series: [
          {label: "Time (s)"},
          {label: "Temperature", scale: "temp", stroke: "#3366cc", width: 2, value: (u, v) => v == null ? "-" : v.toFixed(2)},
          {label: "TargetPWM", scale: "pwm", stroke: "#dc3912", width: 1, value: (u, v) => v == null ? "-" : v.toFixed(1)},
          {label: "TargetTemperature", scale: "temp", stroke: "black", dash: [8, 8], width: 1},
        ],
      };
      plot = new uPlot(options, series, document.getElementById("chart_div"));
      window.addEventListener("resize", () => plot.setSize(chartSize()));
    }

    function redraw() {
      if (plot) plot.setData(series);
    }

    function fetchCsv(onDone) {
      const xhr = new XMLHttpRequest();
      xhr.open("GET", "data.csv");
      xhr.onload = function() { parseCsv(xhr.responseText); redraw(); if (onDone) onDone(); };
      xhr.send();
    }

    window.onload = function() {
      createPlot();
      fetchCsv(function() {
        if (window.EventSource) {
          // new rows are pushed once per second by the ESP (/events)
          const events = new EventSource("events");
          events.addEventListener("rows", function(event) {
            for (const r of JSON.parse(event.data)) addRow(r[0], r[1], r[2], r[3]);
            redraw();
          });
        } else {
          setInterval(fetchCsv, 3000);
        }
      });
    };

    // Download Measurement File
    function onFileDownload(){
      var obj_http_request=new XMLHttpRequest();
      // request data.csv from http server
      obj_http_request.open("GET","data.csv");
      // define function which is executed when requested is fully loaded
      obj_http_request.onload= function() {
        // get response as string from esp async webserver
        var str_buf = obj_http_request.responseText;
        saveDownloadedData('data.csv', str_buf);
      }
      obj_http_request.send();
    }

    const saveDownloadedData = (fileName, data) => {
      // code based on: https://stackoverflow.com/questions/3665115/how-to-create-a-file-in-memory-for-user-to-download-but-not-through-server
      if(~navigator.userAgent.indexOf('MSIE') || ~navigator.appVersion.indexOf('Trident/')) { /* IE9-11 */
          const blob = new Blob([data], { type: 'text/csv;charset=utf-8;' });
          navigator.msSaveBlob(blob, fileName);
      } else {
          const link = document.createElement('a')
          link.setAttribute('target', '_blank');
          if(Blob !== undefined) {
              const blob = new Blob([data], { type: 'text/plain' });
              link.setAttribute('href', URL.createObjectURL(blob));
          } else {
              link.setAttribute('href', 'data:text/plain,' + encodeURIComponent(data));
          }

          ~window.navigator.userAgent.indexOf('Edge')
              && (fileName = fileName.replace(/[&\/\\#,+$~%.'':*?<>{}]/g, '_')); /* Edge */

          link.setAttribute('download', fileName);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
      }
    }

  </script>
</head>
<body>
  <style>
    p {
      display: flex;
      justify-content: left;
      align-items: center;
    }

    p > span {
      display: inline-block;
      width: 20px;
    }

    p > span:first-child {
      display: inline-block;
      width: 200px;
    }

    input[type=text] {
      width: 50%;
      padding: 12px 20px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 3px solid #ccc;
      -webkit-transition: 0.5s;
      transition: 0.5s;
      outline: none;
    }

    input[type=text]:focus {
      border: 3px solid #555;
    }

    input[type=button], input[type=submit], input[type=reset] {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 16px 32px;
      text-decoration: none;
      margin: 4px 2px;
      cursor: pointer;
      border-radius: 4px;
      font-size:medium;
      overflow: hidden;
      cursor: pointer;
    }

    input[type=button]:hover, input[type=submit]:hover, input[type=reset]:hover {
      background: #009e00;
    }
  </style>
