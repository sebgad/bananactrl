# Firmware build + host unit tests on every push to main and every pull request.
# Also called by release.yml, which publishes the uploaded `firmware` artifact.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags: CMakeLists.txt derives the version with `git describe`

      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py build
          idf.py merge-bin -o bananactrl-factory.bin

      - name: Collect images
        shell: bash
        run: |
          mkdir -p dist
          cp build/bananactrl.bin build/storage.bin build/bootloader/bootloader.bin \
             build/partition_table/partition-table.bin build/ota_data_initial.bin \
             build/bananactrl-factory.bin build/flash_args dist/
          python3 -c "import json; print(json.load(open('build/project_description.json'))['project_version'])" > dist/VERSION
          (cd dist && md5sum *.bin > MD5SUMS)
          cat dist/VERSION dist/MD5SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/

      # ArduinoJson as fetched by the component manager, for the host tests
      - uses: actions/upload-artifact@v4
        with:
          name: managed-components
          path: managed_components/bblanchon__arduinojson/

  host-tests:
    needs: firmware
    runs-on: ubuntu-latest
    container: gcc:16 # the tests are C++26 (gnu++26)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: managed-components
          path: managed_components/bblanchon__arduinojson/

      - name: Install CMake, Ninja, GoogleTest
        run: apt-get update && apt-get install -y --no-install-recommends cmake ninja-build libgtest-dev

      - name: Test
        run: |
          cmake -S test/host -B build-host -G Ninja
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure
