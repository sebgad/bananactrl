# Push a tag vMAJOR.MINOR.PATCH (e.g. v1.2.0, or v1.3.0-rc.1 for a pre-release) to publish a GitHub release
# with the firmware images and the matching CHANGELOG.md section as release notes.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist/

      - name: Check version
        run: |
          # the firmware must report exactly the tag (no -N-g<hash>, no -dirty)
          test "$(cat dist/VERSION)" = "${GITHUB_REF_NAME#v}" \
            || { echo "firmware version $(cat dist/VERSION) != tag $GITHUB_REF_NAME"; exit 1; }

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            /^## \[/ { if (found) exit; found = index($0, "[" version "]") > 0; next }
            found' CHANGELOG.md > notes.md
          test -s notes.md || echo "No CHANGELOG.md entry for ${GITHUB_REF_NAME#v}." > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd dist
          # the assets already carry the version in their names (tools/dist.py)
          prerelease=""
          [[ "$version" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "bananactrl $version" \
             --notes-file ../notes.md $prerelease *.bin *.tar flash_args MD5SUMS
